[project]
name = "jarvis-ai-assistant"
version = "0.1.0"
description = "JARVIS AI Assistant - Agent-based AI that can browse web, search, and interact with your computer"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
